services:
  web:
    build: ./web
    image: ghcr.io/bastetoi/boucher-de-perthes-website:${WEB_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /config
      - /data

  # Exposition via Cloudflare Tunnel : docker compose --profile tunnel up -d
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web
