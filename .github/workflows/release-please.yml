name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Image arm64 (Raspberry Pi) publiée sur GHCR uniquement quand une release est créée.
  # Les tags poussés avec GITHUB_TOKEN ne déclenchent pas d'autre workflow : le build est donc ici.
  publish-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR n'accepte que des noms en minuscules (le compte est « Bastetoi »)
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/boucher-de-perthes-website" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.release-please.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
